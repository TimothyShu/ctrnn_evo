# Example forge-queue job spec for ctrnn_evo.
# Submit via the dashboard (paste-YAML mode) or `cp` into ~/queue/pending/ on
# forge. Rename to something descriptive, e.g. phase1a_edge_0007.yaml
#
# SCHEMA: experiment settings live under `params:` — NOT at the top level.
#   - `config:` (a param) names a base-config YAML; its keys become defaults.
#   - every other param is a run_experiment.py flag (drop the leading --) and
#     overrides the config.
# Top-level keys other than project/venv/notes/gpu/notify/params are rejected by
# the queue. The queue forces --output-dir to the archived run dir, so don't set
# it here.
project: ctrnn_evo
venv: ~/jax-env
notes: "Phase 1a: pure edge-count cost at lambda=0.0007, 10 reps x 500 gens"
params:
  config: configs/base_m8.yaml
  lambda-edge: 0.0007
  lambda-dist: 0.0
