# Base configuration for multi-food-type experiments.
# Extends base_m8.yaml with settings appropriate for strip-separated food types.
#
# ── Job spec template (forge-queue) ───────────────────────────────────────────
# Experiment settings go under `params:` — `config:` and the overrides are all
# params, NOT top-level keys (the queue rejects unknown top-level keys).
#
# project: ctrnn_evo
# venv: ~/jax-env
# notes: "Short description for ntfy notification"
# params:
#   config: configs/multifood_m8.yaml
#   lambda-edge: 0.0
#   lambda-dist: 0.0
#   lambda-act:  0.0
#   n-replicates: 10
#   n-generations: 500
#
# Don't set output-dir — the queue forces it to the archived run dir.
# This config sets condition: modular (baseline is already established in
# runs/multifood/baseline); add `condition: both` under params only if needed.
#
# ─────────────────────────────────────────────────────────────────────────────

n-replicates: 10
n-generations: 500
n-evals: 5
pop-size: 1000

# Food type structure
n-food-types: 2

# Slower drift keeps type strips spatially separated through the episode.
# With drift=0.2, RMS displacement over 2000 steps ≈ 9 units (strip width = 50).
hotspot-drift: 0.2

# Smaller reward patch — requires more precise navigation to eat.
hotspot-sigma: 3.0

# Lower metabolism — doubles starvation budget (~100 steps vs ~38),
# smoothing out bimodal fitness and giving evolution more gradient to work with.
metabolism: 0.005

# Cost coefficients (set in overrides)
lambda-edge: 0.0
lambda-dist: 0.0
lambda-act:  0.0

condition: modular
output-dir: runs/multifood/default
verbose: true
