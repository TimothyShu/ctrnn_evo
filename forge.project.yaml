# forge-queue project descriptor for ctrnn_evo.
# Read by the dashboard to render a typed "new job" form. The queue itself
# ignores this file — it only constrains the UI. See forge-queue/contract/README.md.
name: ctrnn_evo
description: CTRNN neuroevolution — Clune modularity (baseline vs modular)
venv: ~/jax-env
params:
  - {name: config,        type: str,   default: "",      help: "base config YAML, e.g. configs/base_m8.yaml"}
  - {name: condition,     type: enum,  choices: [both, baseline, modular], default: both}
  - {name: n-replicates,  type: int,   default: 10,      help: "independent runs per condition"}
  - {name: n-generations, type: int,   default: 500}
  - {name: n-evals,       type: int,   default: 5,       help: "episodes per fitness estimate"}
  - {name: pop-size,      type: int,   default: 1000}
  - {name: lambda-edge,   type: float, default: 0.0,     help: "edge-count cost coefficient"}
  - {name: lambda-dist,   type: float, default: 0.001,   help: "distance-weighted wiring cost"}
  - {name: lambda-act,    type: float, default: 0.0,     help: "activation cost coefficient"}
  - {name: n-food-types,  type: int,   default: 1}
  - {name: seed,          type: int,   default: 0}
  - {name: smoke-test,    type: bool,  default: false,   help: "quick run: 2 reps x 5 gens x 1 eval"}
  - {name: verbose,       type: bool,  default: false}
